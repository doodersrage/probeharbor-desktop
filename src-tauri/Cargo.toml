[package]
name = "thermaltrace-desktop"
version = "0.1.0"
description = "ThermalTrace Desktop — native companion dashboard"
authors = ["ThermalTrace"]
edition = "2021"
license = "MIT"

[lib]
name = "thermaltrace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
