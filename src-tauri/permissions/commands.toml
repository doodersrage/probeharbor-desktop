[[permission]]
identifier = "allow-open-external"
description = "Open http(s) links in the system browser (AppImage-safe env)"
commands.allow = ["open_external"]

[[permission]]
identifier = "allow-start-companion-login"
description = "Start ThermalTrace companion OAuth via localhost loopback"
commands.allow = ["start_companion_login"]

[[permission]]
identifier = "allow-disconnect-companion"
description = "Clear stored ThermalTrace companion session"
commands.allow = ["disconnect_companion"]

[[permission]]
identifier = "allow-has-companion-session"
description = "Check whether a companion session is stored"
commands.allow = ["has_companion_session"]

[[permission]]
identifier = "allow-api-request"
description = "Authenticated JSON API requests to thermaltrace.dev"
commands.allow = ["api_request"]

[[permission]]
identifier = "allow-api-form-post"
description = "Authenticated form POST to thermaltrace.dev dashboard APIs"
commands.allow = ["api_form_post"]

[[permission]]
identifier = "allow-set-kiosk-mode"
description = "Toggle fullscreen kiosk / shop mode"
commands.allow = ["set_kiosk_mode"]
